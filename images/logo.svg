<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 120" width="100%" height="100%">
  <defs>
    <linearGradient id="gradEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="gradLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="gradPulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(15, 10)">
    <!-- Tech Outer Hexagon Ring -->
    <polygon points="50,5 92,27.5 92,72.5 50,95 8,72.5 8,27.5" fill="none" stroke="url(#gradEmerald)" stroke-width="3" stroke-dasharray="6 3" opacity="0.85" />
    
    <!-- Inner glowing shield circle -->
    <circle cx="50" cy="50" r="38" fill="#0b1728" stroke="url(#gradEmerald)" stroke-width="2.5" />
    
    <!-- Stylized Leaf (Agriculture & Sustainability) -->
    <path d="M 50,22 C 68,28 72,50 56,66 C 42,52 38,34 50,22 Z" fill="url(#gradLeaf)" opacity="0.9" />
    
    <!-- Healthcare ECG pulse line crossing the emblem -->
    <path d="M 22,55 L 36,55 L 42,42 L 48,68 L 54,34 L 60,60 L 66,55 L 78,55" fill="none" stroke="#ffffff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
    
    <!-- Neural Network AI Nodes -->
    <circle cx="50" cy="22" r="3.5" fill="#34d399" />
    <circle cx="72" cy="38" r="3" fill="#06b6d4" />
    <circle cx="28" cy="38" r="3" fill="#38bdf8" />
    <circle cx="42" cy="76" r="3" fill="#10b981" />
    <circle cx="58" cy="76" r="3" fill="#06b6d4" />
    <line x1="50" y1="22" x2="72" y2="38" stroke="#34d399" stroke-width="1.2" opacity="0.6" />
    <line x1="50" y1="22" x2="28" y2="38" stroke="#38bdf8" stroke-width="1.2" opacity="0.6" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(130, 26)">
    <!-- Main Title -->
    <text x="0" y="32" font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" letter-spacing="1.5" fill="#ffffff" class="logo-text-title">
      AIHASC <tspan fill="url(#gradEmerald)" font-weight="800">2027</tspan>
    </text>
    
    <!-- Subtitle: Conference Full Name -->
    <text x="0" y="54" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.4" fill="#94a3b8" class="logo-text-sub">
      INTERNATIONAL CONFERENCE ON AI FOR HEALTHCARE,
    </text>
    <text x="0" y="69" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.4" fill="#38bdf8" class="logo-text-sub2">
      AGRICULTURE AND SUSTAINABLE COMPUTING
    </text>
    <text x="0" y="85" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="10.5" font-weight="500" letter-spacing="0.3" fill="#64748b" class="logo-text-meta">
      25–26 March 2027 · Pune, Maharashtra, India · First Edition
    </text>
  </g>
</svg>
